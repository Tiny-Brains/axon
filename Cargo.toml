# Axon — the model loader. Holds ONNX weights resident, evaluates each competitor's adapter under an
# operation count of its own keeping, runs the graph, and answers one call per turn for a whole
# wave. A second instance of the same binary is the platform's only data path for admission.
#
# docs/design.md is the specification; where this crate and that document disagree, this is a bug.
[package]
name = "axon"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[dependencies]
# A reviewed HMAC-SHA256 for the SigV4 chain in src/store/s3.rs: the one place where getting a
# primitive subtly wrong would be both silent and a security bug.
hmac = "0.12"
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
ureq = "3"
zstd = "0.13"

[dev-dependencies]
# The differential test only. The dialect is not built on datalogic-rs -- see src/dialect/mod.rs --
# but the core JSONLogic subset must agree with it, because that is the engine Orion evaluates
# workflow logic with and a competitor should not have to learn two dialects.
datalogic-rs = { version = "5.4", features = ["templating"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
